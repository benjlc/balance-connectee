<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — Ruche de Couesnon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style_login.css">
</head>
<body>

<!-- Fond décoratif -->
<div class="bg-pattern">
    <svg class="bg-hex" viewBox="0 0 200 230" fill="none">
        <path d="M100 0L200 57.5v115L100 230 0 172.5V57.5z" fill="#F5A623"/>
    </svg>
    <svg class="bg-hex" viewBox="0 0 200 230" fill="none">
        <path d="M100 0L200 57.5v115L100 230 0 172.5V57.5z" fill="#F5A623"/>
    </svg>
    <svg class="bg-hex" viewBox="0 0 200 230" fill="none">
        <path d="M100 0L200 57.5v115L100 230 0 172.5V57.5z" fill="#F5A623"/>
    </svg>
</div>
<div class="bg-glow"></div>

<!-- Contenu -->
<div class="login-wrap">

    <!-- Logo -->
    <div class="login-logo">
        <div class="logo-icon">
            <svg viewBox="0 0 40 40" fill="none">
                <ellipse cx="20" cy="22" rx="10" ry="13" fill="#F5A623" stroke="#C47C0A" stroke-width="1.5"/>
                <rect x="13" y="16" width="14" height="3.5" rx="1.75" fill="#5C3A00" opacity="0.35"/>
                <rect x="13" y="21" width="14" height="3.5" rx="1.75" fill="#5C3A00" opacity="0.35"/>
                <rect x="13" y="26" width="14" height="3.5" rx="1.75" fill="#5C3A00" opacity="0.35"/>
                <ellipse cx="20" cy="12" rx="5" ry="4" fill="#FDE68A" stroke="#C47C0A" stroke-width="1.2"/>
                <path d="M15 10 Q10 4 7 7" stroke="#C47C0A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
                <path d="M25 10 Q30 4 33 7" stroke="#C47C0A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
                <ellipse cx="13" cy="9" rx="5" ry="3" fill="white" fill-opacity="0.55" transform="rotate(-25 13 9)"/>
                <ellipse cx="27" cy="9" rx="5" ry="3" fill="white" fill-opacity="0.55" transform="rotate(25 27 9)"/>
            </svg>
        </div>
        <div class="logo-text">
            <div class="logo-text-main">Couesnon</div>
            <div class="logo-text-sub">Apiculture · Tableau de bord</div>
        </div>
    </div>

    <!-- Carte -->
    <div class="login-card">
        <div class="login-card-title">Connexion</div>
        <div class="login-card-sub">Accédez à votre espace de suivi des ruches</div>

        <!-- Erreur -->
        <div class="error-msg" id="error-msg">
            <svg viewBox="0 0 16 16" fill="none" width="15" height="15">
                <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/>
                <path d="M8 4.5v4M8 11v.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span id="error-text">Identifiants incorrects</span>
        </div>

        <!-- Champ email -->
        <div class="field">
            <label for="input-user">Email</label>
            <div class="field-input-wrap">
                <svg class="field-icon" viewBox="0 0 16 16" fill="none">
                    <circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
                    <path d="M2 13.5c0-2.5 2.7-4.5 6-4.5s6 2 6 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                </svg>
                <input type="email" id="input-user" placeholder="ex: nom@example.com" autocomplete="email" />
            </div>
        </div>

        <!-- Champ mot de passe -->
        <div class="field">
            <label>Mot de passe</label>
            <div class="field-input-wrap">
                <svg class="field-icon" viewBox="0 0 16 16" fill="none">
                    <rect x="3" y="7" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                    <path d="M5.5 7V5a2.5 2.5 0 015 0v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    <circle cx="8" cy="11" r="1" fill="currentColor"/>
                </svg>
                <input type="password" id="input-pw" placeholder="••••••••" autocomplete="current-password" />
                <button class="toggle-pw" id="toggle-pw" type="button" title="Afficher le mot de passe">
                    <svg id="eye-show" viewBox="0 0 16 16" fill="none">
                        <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.3"/>
                        <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
                    </svg>
                    <svg id="eye-hide" viewBox="0 0 16 16" fill="none" style="display:none;">
                        <path d="M1 1l14 14M6.5 6.6A2 2 0 0010.4 9.5M4.2 4.3C2.5 5.4 1 8 1 8s2.5 5 7 5c1.4 0 2.6-.4 3.7-1M6.5 3.1C7 3 7.5 3 8 3c4.5 0 7 5 7 5s-.6 1.3-1.7 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <button class="btn-login" id="btn-login">Se connecter</button>

    <div class="login-footer">
        Ruche de Couesnon · Système de surveillance apicole<br>
        Accès réservé aux personnes autorisées
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
    // Redirige si déjà connecté
    if (AUTH.getSession()) window.location.href = 'index.html';

    const inputUser = document.getElementById('input-user');
    const inputPw   = document.getElementById('input-pw');
    const btnLogin  = document.getElementById('btn-login');
    const errorMsg  = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');
    const togglePw  = document.getElementById('toggle-pw');
    const eyeShow   = document.getElementById('eye-show');
    const eyeHide   = document.getElementById('eye-hide');
    inputUser.setAttribute('aria-label', 'Email');
    inputPw.setAttribute('aria-label', 'Mot de passe');
    togglePw.setAttribute('aria-label', 'Afficher le mot de passe');

    // Toggle visibilité mdp
    togglePw.addEventListener('click', () => {
        const isText = inputPw.type === 'text';
        inputPw.type = isText ? 'password' : 'text';
        eyeShow.style.display = isText ? '' : 'none';
        eyeHide.style.display = isText ? 'none' : '';
        togglePw.setAttribute('aria-label', isText ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
        togglePw.title = isText ? 'Afficher le mot de passe' : 'Masquer le mot de passe';
    });

    function showError(msg) {
        errorText.textContent = msg;
        errorMsg.classList.remove('visible');
        void errorMsg.offsetWidth; // re-trigger animation
        errorMsg.classList.add('visible');
    }

    async function doLogin() {
        const email = inputUser.value.trim();
        const pw   = inputPw.value;

        if (!email || !pw) { showError("Veuillez remplir tous les champs"); return; }

        btnLogin.classList.add('loading');
        btnLogin.textContent = 'Connexion…';

        btnLogin.disabled = true;

        const result = await AUTH.login(email, pw);
        if (result.success) {
            window.location.href = 'index.html';
        } else {
            btnLogin.classList.remove('loading');
            btnLogin.textContent = 'Se connecter';
            btnLogin.disabled = false;
            showError(result.message);
            inputPw.value = '';
            inputPw.focus();
        }
    }

    btnLogin.addEventListener('click', doLogin);

    // Entrée au clavier
    [inputUser, inputPw].forEach(el => {
        el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    });

    // Focus auto
    inputUser.focus();
</script>
</body>
</html>
